<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼多多数据挖掘</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="bookmark" id="bookmark">功能区</div>
      <nav class="side-nav" id="nav" aria-label="主导航"></nav>
    </aside>
    <div class="workspace">
      <header class="tabbar">
        <button class="nav-toggle" type="button" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">菜单</button>
        <div class="tabs" id="tabs" role="tablist" aria-label="已打开的页面"></div>
      </header>
      <main class="stage" id="stage"></main>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
