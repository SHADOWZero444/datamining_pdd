<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼多多数据挖掘</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/tools-overview.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="bookmark" id="bookmark">功能区</div>
      <nav class="side-nav" id="nav" aria-label="主导航"></nav>
    </aside>
    <div class="workspace">
      <div class="tab-stack" id="tab-stack">
        <button class="nav-toggle" type="button" id="nav-toggle" aria-expanded="false" aria-controls="sidebar">菜单</button>
        <div class="tab-row" id="tabs-main" role="tablist" aria-label="功能与词条"></div>
        <div class="tab-row tab-row-detail" id="tabs-detail" role="tablist" aria-label="商品详情" hidden></div>
      </div>
      <div class="capture-bar" id="capture-bar" hidden></div>
      <main class="stage" id="stage"></main>
    </div>
  </div>
  <div id="context-menu" class="context-menu" role="menu" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <dialog id="capture-dialog" class="capture-dialog" aria-labelledby="capture-title" aria-describedby="capture-help">
    <div class="capture-dialog-heading">
      <h2 id="capture-title">人机验证</h2>
      <button type="button" class="ghost" id="capture-close" autofocus>关闭页面</button>
    </div>
    <p id="capture-help">按网站提示点击或拖动。关闭此窗口不会跳过验证；如果网站已提示完成，可以点击“继续抓取”。</p>
    <p id="capture-view-status" role="status">正在加载页面…</p>
    <div class="capture-screen" id="capture-screen"></div>
    <form id="capture-text-form" class="capture-text-form">
      <label for="capture-text">输入文字</label>
      <input id="capture-text" type="text" maxlength="500" autocomplete="off" placeholder="先点击页面中的输入框，再在这里输入">
      <button class="ghost" type="submit">发送文字</button>
      <button class="ghost" type="button" id="capture-tab">切换输入框</button>
    </form>
    <div class="capture-dialog-actions">
      <button class="ghost" type="button" data-capture-browser="resume" id="capture-continue">继续抓取</button>
      <button class="stop" type="button" data-stop-search>停止抓取</button>
    </div>
  </dialog>
  <script src="js/core/ui.js"></script>
  <script src="js/core/clipboard.js"></script>
  <script src="js/features/capture-view.js"></script>
  <script src="js/features/overview.js"></script>
  <script src="js/features/settings.js"></script>
  <script src="js/features/navigation.js"></script>
  <script src="js/features/library.js"></script>
  <script src="js/features/result-filters.js"></script>
  <script src="js/features/search.js"></script>
  <script src="js/features/capture.js"></script>
  <script src="js/features/pages.js"></script>
  <script src="js/features/forms.js"></script>
  <script src="js/features/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
